name: VoiceGuard
options:
  bundleIdPrefix: com.quoguri.voiceguard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VoiceGuardCore:
    path: Packages/VoiceGuardCore
targets:
  VoiceGuard:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: VoiceGuardCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VoiceGuard
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "주변 대화의 감정 격양 구간을 실시간으로 감지하고 자동으로 녹음하기 위해 마이크 접근 권한이 필요합니다. 분석은 100% 기기 내부에서만 처리됩니다."
        NSFaceIDUsageDescription: "민감한 대화 녹음 파일을 보호하기 위해 Face ID로 앱 잠금을 해제합니다. 생체 정보는 기기 밖으로 나가지 않으며 앱이 저장하지 않습니다."
        NSSpeechRecognitionUsageDescription: "녹음된 대화를 기기 안에서만 텍스트로 변환해 핵심 쟁점을 요약하기 위해 음성 인식 권한이 필요합니다. 오디오와 텍스트는 서버로 전송되지 않습니다."
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quoguri.voiceguard.app
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  VoiceGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VoiceGuard
      - package: VoiceGuardCore
schemes:
  VoiceGuard:
    build:
      targets:
        VoiceGuard: all
        VoiceGuardTests: [test]
    test:
      targets:
        - VoiceGuardTests
